name: Update rates

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 UTC 22:00 = 한국시간 오전 7시
  workflow_dispatch:        # 필요할 때 수동 실행 버튼도 생김

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch rates
        env:
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: node scripts/fetch-rates.js
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rates.json
          git diff --staged --quiet || git commit -m "chore: update rates $(date -u +%F)"
          git push